<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilíada Atêlie | Administração</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div id="main-container">
        <nav class="main-nav" style="background-color: #131921; padding: 10px 20px;">
            <ul class="nav-list" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; align-items: center;">
                <li><a href="index.html" style="color: #ffffff; text-decoration: none; font-weight: bold;">← Voltar para a Loja</a></li>
                <li style="margin-left: auto;"><a href="perfil.html" style="color: #ffffff; text-decoration: none;">Minha Conta</a></li>
                <li><a href="#" id="btn-logout" style="color: #ffffff; text-decoration: none;">Sair</a></li>
            </ul>
        </nav>

        <div class="container mt-4 mb-5">
            <header class="header-content text-center mb-4">
                <h1>Administração de Produtos</h1>
                <p>Gerencie o catálogo de produtos da loja</p>
            </header>

            <div id="error-message" class="alert alert-danger" style="display: none;"></div>
            <div id="success-message" class="alert alert-success" style="display: none;"></div>

            <!-- Formulário de Cadastro -->
            <div class="card mb-4">
                <div class="card-header" style="background-color: #131921; color: white;">
                    <h5 class="mb-0">Cadastrar Novo Produto</h5>
                </div>
                <div class="card-body">
                    <form id="form-produto">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nome-produto" class="form-label">Nome do Produto *</label>
                                <input type="text" class="form-control" id="nome-produto" placeholder="Mínimo 3 caracteres" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="marca-produto" class="form-label">Marca *</label>
                                <input type="text" class="form-control" id="marca-produto" placeholder="Ex: Ilíada Design" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="preco-produto" class="form-label">Preço (R$) *</label>
                                <input type="number" class="form-control" id="preco-produto" step="0.01" min="0.01" placeholder="0.00" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="estoque-produto" class="form-label">Estoque</label>
                                <input type="number" class="form-control" id="estoque-produto" min="0" value="0" placeholder="Quantidade em estoque">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descricao-produto" class="form-label">Descrição</label>
                            <textarea class="form-control" id="descricao-produto" rows="4" placeholder="Descrição detalhada do produto"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" style="background-color: #febd69; border-color: #febd69; color: #111;">
                            CADASTRAR PRODUTO
                        </button>
                        <button type="button" class="btn btn-secondary" id="btn-limpar">
                            LIMPAR FORMULÁRIO
                        </button>
                    </form>
                </div>
            </div>

            <!-- Listagem de Produtos -->
            <div class="card">
                <div class="card-header" style="background-color: #131921; color: white;">
                    <h5 class="mb-0">Produtos Cadastrados</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="busca-produto" placeholder="Buscar produtos por nome ou marca...">
                    </div>

                    <div id="loading-produtos" class="text-center" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>

                    <div id="lista-produtos" class="table-responsive">
                        <!-- Produtos serão inseridos aqui dinamicamente -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="utility-footer" style="background-color: #131921; color: white; padding: 20px; text-align: center; margin-top: 50px;">
        <p>Ilíada Atêlie &copy; 2025</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/admin_produtos.js"></script>
</body>
</html>
