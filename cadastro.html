<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Docelar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="cadastro-wrapper">
        
        <div class="illustration-panel">
            <div class="illustration-content">
                <h2>Crie sua conta Ilíada</h2>
                <p>Muitas novidades e ofertas esperam por você!</p>
            </div>
        </div>

        <div class="form-panel">
            <h1 class="form-title">Olá, Amigo(a)!</h1>
            
            <form id="cadastroFormCompleto" class="cadastro-form">

                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" placeholder="Insira seu nome" required>

                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" placeholder="Insira seu e-mail" required>

                <label for="cpf">CPF (Apenas números) *</label>
                <input type="text" id="cpf" name="cpf" placeholder="00000000000" maxlength="11" required>

                <label for="senha">Senha *</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required>

                <label for="confirmarSenha">Confirme a Senha *</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required>

                <label for="cep">CEP (Apenas números) *</label>
                <input type="text" id="cep" name="cep" placeholder="00000000" maxlength="8" required>
                <small style="color: #666; font-size: 12px;">Digite o CEP para preencher automaticamente</small>

                <label for="logradouro">Logradouro / Rua *</label>
                <input type="text" id="logradouro" name="logradouro" placeholder="Rua, Avenida, etc." required>

                <label for="numero">Número *</label>
                <input type="text" id="numero" name="numero" placeholder="Número" required>

                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, etc. (opcional)">

                <label for="bairro">Bairro *</label>
                <input type="text" id="bairro" name="bairro" placeholder="Nome do bairro" required>

                <label for="cidade">Cidade *</label>
                <input type="text" id="cidade" name="cidade" placeholder="Nome da cidade" required>

                <label for="estado">Estado (UF) *</label>
                <input type="text" id="estado" name="estado" placeholder="SP" maxlength="2" required>

                <button type="submit" class="btn-submit">CADASTRAR</button>
            </form>

            <div class="links-utilitarios">
                <a href="#">Já tem uma conta?</a>
                <a href="#">Voltar para a Home</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/viacep.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
