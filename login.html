<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login - Ilíada Atêlie</title>
</head>
<body>
    <div class="login">
        <img src="asset/img/idle/1.png" id="monster" alt="">
        <form class="formulario" id="loginForm">
            <h2 style="text-align: center; margin-bottom: 20px;">Fazer Login</h2>

            <div id="error-message" style="display: none; background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>

            <label>E-mail</label>
            <input type="email" id="input-usuario" placeholder="e-mail@gmail.com" autocomplete="off" required>

            <label>Senha</label>
            <input type="password" id="input-clave" placeholder="*******" required>

            <button type="submit" id="btnLogin">Login</button>

            <div style="text-align: center; margin-top: 15px;">
                <a href="cadastro.html" style="color: #666; text-decoration: none;">Não tem uma conta? Cadastre-se</a>
                <br>
                <a href="index.html" style="color: #666; text-decoration: none; margin-top: 10px; display: inline-block;">Voltar para Home</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    <script src="script_animacao.js"></script>
</body>
</html>
